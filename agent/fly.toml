# Fly.io config for the SmileDesk agent. Deploy from this folder: `fly launch --no-deploy` (keep this file), then
# `fly secrets set ...` (see docs/DEPLOY.md) and `fly deploy`. Rename `app` if the name is taken.
app = "smiledesk-agent"
primary_region = "bom"  # Mumbai

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "8080"
  DEMO_MODE = "true"
  MAX_VOICE_SESSIONS = "2"
  MAX_VOICE_SESSION_SECONDS = "240"
  MAX_VOICE_CALLS_PER_DAY = "60"
  RATE_LIMIT_PER_MINUTE = "30"

[http_service]
  internal_port = 8080
  force_https = true
  # Voice needs a live process: no scale-to-zero, no cold starts.
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    grace_period = "60s"
    interval = "30s"
    timeout = "10s"
    method = "GET"
    path = "/api/health"

[[vm]]
  size = "shared-cpu-2x"
  memory = "2gb"
